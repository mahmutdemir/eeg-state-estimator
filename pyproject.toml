[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eeg-state-estimator"
version = "0.1.0"
description = "A verified multitaper spectral front end and recursive state estimator for single-channel EEG."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# Runtime dependencies are deliberately minimal. The spectral estimator is built
# directly on scipy's DPSS routine and numpy's FFT; nothing else is needed to run
# the library. Test-only and data-fetching extras are kept out of this list so an
# install of the package itself stays small.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Only needed to regenerate the figures in docs/ and to run the notebooks in
# workbooks/. Kept out of `dev` so the CI test job does not install a plotting
# stack it never uses.
docs = [
    "matplotlib>=3.8",
    "jupyter>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eeg_state_estimator"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "req(id): the requirement in requirements.md that this test verifies",
]
addopts = "--strict-markers"

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "N",    # pep8 naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # shadowing builtins
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
# N803/N806 allow conventional mathematical names. In a filtering module the
# state-space matrices are universally written A, Q, C, R and the Kalman gain K;
# renaming them to satisfy a lowercase rule would make the code harder to check
# against any textbook, which is the opposite of the goal.
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
# The workbooks are narrative, not library code. They print results for a reader
# (T201), set sys.path before importing the package (E402), use compact
# `a = 1; b = 2` lines to keep a cell readable as one idea (E702), and put real
# typographic dashes in axis labels and prose, which is correct for text a human
# reads (RUF001-003).
"workbooks/**" = ["E501", "T201", "E402", "E702", "RUF001", "RUF002", "RUF003"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
# Deliberately strict on our own code but NOT `strict = true`. Full strict mode
# turns on disallow_any_generics, which fights numpy's array generics constantly
# and produces noise rather than safety. The flags below catch the errors that
# actually matter here: untyped definitions, implicit Optional, and returning Any.
[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
pretty = true

# SciPy ships no type information. Two options: add scipy-stubs as a dev dependency, or
# silence the import here. The override is one block, it cannot drift out of sync with
# the installed scipy version, and it is honest about the situation. The resulting Any is
# confined to a single adapter (`dpss_tapers`), which coerces to a typed array before
# returning, so it never escapes into the rest of the package.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
